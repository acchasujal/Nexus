[project]
name = "nexus-backend"
version = "1.0.0"
description = "NEXUS Criminal Intelligence Platform Backend for SIH 2026 PS 26189"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "networkx>=3.2",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "jsonschema>=4.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "shared", "artifacts"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
