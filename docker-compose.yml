# Local development only. Do not use this file to deploy or attach a shared DB.
name: nexus-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private local POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26.30-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set a private local NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      # New volume prevents an implicit upgrade of an older 5.20 store.
      - neo4j_526_data:/data
    healthcheck:
      # HTTP liveness only; the application also verifies Bolt/auth/database access.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      NEXUS_REPOSITORY: postgres
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:?Set a private local POSTGRES_PASSWORD}@postgres:5432/nexus_db
      GRAPH_BACKEND: ${GRAPH_BACKEND:-memory}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set a private local NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      NEO4J_FAILURE_POLICY: ${NEO4J_FAILURE_POLICY:-required}
      NEO4J_CONNECTION_TIMEOUT: ${NEO4J_CONNECTION_TIMEOUT:-5}
      NEO4J_QUERY_TIMEOUT: ${NEO4J_QUERY_TIMEOUT:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      ARTIFACT_PATH: artifacts/nexus_graph/nexus_graph.json
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_526_data:
