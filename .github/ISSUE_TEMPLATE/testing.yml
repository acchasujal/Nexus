name: Testing
description: Add or investigate regression, safety or performance coverage
labels: ["type/testing"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic fixtures. Distinguish regression tests, benchmarks and deployed observations; record actual results rather than assumptions.
  - type: textarea
    id: objective
    attributes:
      label: Behavior or risk being tested
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Coverage and acceptance criteria
      description: Include workload, environment and thresholds where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Expected evidence
      description: Use progress.md for status and existing benchmark artifacts for measurements.
    validations:
      required: true
