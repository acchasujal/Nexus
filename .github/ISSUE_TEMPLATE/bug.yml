name: Bug
description: Report a reproducible problem using synthetic data
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe expected and actual behavior. Use synthetic records and redact secrets. Follow AGENTS.md and include the relevant environment.
  - type: input
    id: environment
    attributes:
      label: Environment and commit
      description: Local or hosted; browser/runtime and commit SHA.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include the smallest synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include sanitized errors and relevant screenshots.
    validations:
      required: true
