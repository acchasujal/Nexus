name: Refactor
description: Propose a focused structural change
labels: ["type/refactor"]
body:
  - type: markdown
    attributes:
      value: |
        Reuse existing services and keep behavior changes separate. Record architectural decisions in decisions.md when applicable.
  - type: textarea
    id: why
    attributes:
      label: Problem and reason for the change
      description: Explain the concrete maintenance benefit.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: List affected modules and contracts.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Preserve assertions and report any existing baseline failures.
    validations:
      required: true
