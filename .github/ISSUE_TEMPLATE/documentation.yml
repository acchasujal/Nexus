name: Documentation
description: Correct or improve the canonical project documentation
labels: ["type/docs"]
body:
  - type: markdown
    attributes:
      value: |
        Follow AGENTS.md. Update canonical documentation alongside implementation.
        Keep status in progress.md and architectural decisions in decisions.md.
        Archive superseded plans instead of creating competing guides.
  - type: dropdown
    id: doc
    attributes:
      label: Document being updated
      options:
        - README.md
        - docs/PROJECT_REPORT.md
        - docs/ARCHITECTURE.md
        - docs/DATA_MODEL.md
        - docs/API.md
        - docs/INTELLIGENCE_PIPELINE.md
        - docs/SECURITY.md
        - docs/BENCHMARKS.md
        - docs/DEMO.md
        - docs/DEPLOYMENT.md
        - docs/DEVELOPMENT.md
        - progress.md
        - decisions.md
        - CONTRIBUTING.md
        - Other
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What is inaccurate or missing?
      description: Include the relevant implementation, test or source evidence.
    validations:
      required: true
