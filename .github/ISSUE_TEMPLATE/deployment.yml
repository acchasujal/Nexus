name: Deployment & Infrastructure
description: Docker Compose, environment config, or CI/CD change
labels: ["type/deployment"]
body:
  - type: dropdown
    id: target
    attributes:
      label: Target Environment
      options:
        - Docker Compose (Local Stack)
        - Backend Container (FastAPI)
        - Frontend Container (Vite/Nginx)
        - Database (PostgreSQL / Neo4j)
        - CI/CD Pipeline (.github/workflows)
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Deployment Checklist
      options:
        - label: Local docker-compose up --build verified
        - label: Environment variables documented in .env.example
        - label: No secrets or credentials exposed
