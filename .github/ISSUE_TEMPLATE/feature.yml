name: Feature
description: A new capability or user-facing behavior in NEXUS
labels: ["type/feature"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Subsystem Component
      options:
        - Entity Resolution & Disambiguation
        - Knowledge Graph & Traversal Engine
        - Syndicate Community & Centrality Analytics
        - Temporal Sequencing & Pattern Intelligence
        - Grounded Investigator Copilot
        - Frontend Workspace & Graph Explorer
        - REST API & Data Contracts
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What does this feature accomplish? Link to relevant documentation in docs/.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Verifiable criteria.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: checkboxes
    id: ethical_check
    attributes:
      label: Responsible AI & Governance Pre-Check
      options:
        - label: Does NOT introduce autonomous guilt scoring or recidivism prediction
          required: true
        - label: Preserves evidence provenance for derived relationships
          required: true
        - label: Uses deterministic algorithms before generative LLMs
          required: true
        - label: Includes Pytest / Vitest test coverage
          required: true
