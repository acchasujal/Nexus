name: Research Spike
description: Investigate a specific technical uncertainty
labels: ["type/spike"]
body:
  - type: markdown
    attributes:
      value: |
        State a concrete question and a timebox. Proposals remain TARGET / FUTURE until implemented and verified.
  - type: input
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision this will inform
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Completion evidence
      description: Describe a test, measurement or code-backed finding; record architectural outcomes in decisions.md.
    validations:
      required: true
